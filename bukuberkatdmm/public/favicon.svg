<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="100" y1="20" x2="100" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047" />
      <stop offset="0.5" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F2C59" />
      <stop offset="1" stop-color="#07172F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Badge Base (Deep Royal Navy with Bevel Rim) -->
  <circle cx="100" cy="100" r="94" fill="url(#circleGrad)" stroke="#F59E0B" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Holy Spirit Golden Flame -->
  <path
    d="M100 22 C108 39 120 49 116 68 C113 79 105 87 100 91 C95 87 87 79 84 68 C80 49 92 39 100 22Z"
    fill="url(#goldGradient)"
    filter="url(#shadow)"
  />
  <path
    d="M107 46 C119 58 130 71 125 88 C121 97 113 103 105 105 C114 96 117 83 113 73 C110 65 105 56 107 46Z"
    fill="#F59E0B"
  />
  <path
    d="M93 46 C81 58 70 71 75 88 C79 97 87 103 95 105 C86 96 83 83 87 73 C90 65 95 56 93 46Z"
    fill="#D97706"
  />

  <!-- White Cross at the Center of Flame -->
  <rect x="97" y="74" width="6" height="34" rx="2" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="90" y="81" width="20" height="5.5" rx="2" fill="#FFFFFF"/>

  <!-- Open Bible Pages (Layered Cream/White) -->
  <path
    d="M100 112 C80 98 34 100 20 120 C18 130 24 152 96 160 L100 122 L104 160 C176 152 182 130 180 120 C166 100 120 98 100 112Z"
    fill="#16396E"
  />
  <path
    d="M100 116 C82 106 44 107 30 123 C48 127 78 133 98 145 L100 116Z"
    fill="#FEFDF9"
  />
  <path
    d="M100 116 C118 106 156 107 170 123 C152 127 122 133 102 145 L100 116Z"
    fill="#F8F6F0"
  />

  <!-- Gold Page Edges Accent -->
  <path
    d="M32 126 C50 130 78 137 98 149 L98 153 C76 141 48 134 30 130 Z"
    fill="#F59E0B"
  />
  <path
    d="M168 126 C150 130 122 137 102 149 L102 153 C124 141 152 134 170 130 Z"
    fill="#F59E0B"
  />

  <!-- Bottom Accent Ribbon Lines -->
  <line x1="58" y1="172" x2="88" y2="172" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="100" cy="172" r="3" fill="#F59E0B"/>
  <line x1="112" y1="172" x2="142" y2="172" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
</svg>
